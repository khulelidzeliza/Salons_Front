<p class="eyebrow">{{ 'auth.forgot.eyebrow' | translate }}</p>
<h2 class="heading">{{ 'auth.forgot.title' | translate }}</h2>
<p class="sub">{{ 'auth.forgot.sub' | translate }}</p>

<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="field">
    <label class="field__label" for="reset-email">{{ 'auth.forgot.email' | translate }}</label>
    <input
      id="reset-email"
      type="email"
      class="field__input"
      placeholder="you@example.com"
      formControlName="email"
      [class.is-invalid]="isInvalid()"
    />
    @if (isInvalid()) {
      <span class="field__error">{{ 'auth.forgot.emailError' | translate }}</span>
    }
  </div>

  <button type="submit" class="submit">{{ 'auth.forgot.submit' | translate }}</button>
</form>

<p class="footer">
  <button type="button" class="link" (click)="backToLogin.emit()">{{ 'auth.forgot.back' | translate }}</button>
</p>
