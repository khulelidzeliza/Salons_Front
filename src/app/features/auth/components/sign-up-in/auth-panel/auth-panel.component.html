<section class="panel">
  <div class="panel__inner">
    <div class="auth-card">
      <div class="tabs" role="tablist" [attr.aria-label]="'auth.tabs.label' | translate">
        <div class="tabs__indicator" [class.tabs__indicator--right]="activeTab() === 'register'"></div>
        <button
          type="button"
          role="tab"
          class="tabs__btn"
          [class.tabs__btn--active]="activeTab() === 'login'"
          [attr.aria-selected]="activeTab() === 'login'"
          (click)="select('login')"
        >{{ 'auth.tabs.signIn' | translate }}</button>
        <button
          type="button"
          role="tab"
          class="tabs__btn"
          [class.tabs__btn--active]="activeTab() === 'register'"
          [attr.aria-selected]="activeTab() === 'register'"
          (click)="select('register')"
        >{{ 'auth.tabs.register' | translate }}</button>
      </div>

      @if (activeTab() === 'login') {
        <app-login
          (switchToRegister)="select('register')"
          (forgotRequested)="openForgot($event)"
        />
      } @else {
        <app-register (switchToLogin)="select('login')" />
      }

      <div
        class="fp-overlay"
        #overlay
        [class.open]="showForgot()"
        [attr.inert]="showForgot() ? null : ''"
      >
        <app-forgot-password (backToLogin)="closeForgot()" />
      </div>
    </div>
  </div>
</section>
