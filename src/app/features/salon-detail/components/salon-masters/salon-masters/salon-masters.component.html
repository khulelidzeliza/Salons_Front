<section class="salon-masters" *ngIf="masters.length">
  <header class="section-header">
    <p class="section-header__eyebrow">{{ 'salonDetail.masters.eyebrow' | translate }}</p>
    <h2>{{ category ? (('procedure.' + category) | translate) : ('salonDetail.masters.our' | translate) }} <em>{{ 'salonDetail.masters.titleEm' | translate }}</em></h2>
  </header>
  <div class="salon-masters__grid">
    <app-staff-card *ngFor="let name of masters" [name]="name"></app-staff-card>
  </div>
</section>
