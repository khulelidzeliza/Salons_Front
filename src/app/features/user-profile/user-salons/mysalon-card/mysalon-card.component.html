<article class="card salon-card">
  <div class="salon-card__image">
    <span class="salon-card__badge">{{ 'profile.salons.published' | translate }}</span>

    @if (salon.pictures.length) {
      <img
        class="salon-card__photo"
        [src]="serverUrl + salon.pictures![0]"
        [alt]="salon.englishName" />
    }
   @else {
      <svg class="salon-card__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
        <rect x="6" y="8" width="12" height="13" rx="2" />
        <path d="M9 8V6a3 3 0 0 1 6 0v2" />
      </svg>
    }
  </div>

  <div class="salon-card__body">
    <p class="salon-card__label">{{ salon.location }}</p>
    <h3 class="salon-card__title">{{ salon.englishName }}</h3>

    <div class="salon-card__actions">
      <button type="button" class="btn btn-secondary" (click)="onEdit()">{{ 'profile.salons.edit' | translate }}</button>
      <button type="button" class="btn salon-card__remove" (click)="askDelete()">{{ 'profile.salons.remove' | translate }}</button>
    </div>
  </div>
</article>

<app-confirm-modal
  [open]="showDeleteConfirm"
  variant="danger"
  [loading]="deleting"
  [title]="'profile.salons.deleteModal.title' | translate"
  [message]="'profile.salons.deleteModal.message' | translate: { name: salon.englishName }"
  [confirmText]="'profile.salons.deleteModal.confirm' | translate"
  [cancelText]="'profile.salons.deleteModal.cancel' | translate"
  (confirmed)="onRemove()"
  (cancelled)="showDeleteConfirm = false">
</app-confirm-modal>


<app-edit-salon-modal
  [open]="showEditSalon"
  [salonId]="editingSalonId"
  (closed)="showEditSalon = false">
</app-edit-salon-modal>
