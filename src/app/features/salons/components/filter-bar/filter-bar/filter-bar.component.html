<div class="filters">
  <label class="filters__search">
    <lucide-icon [img]="SearchIcon" [size]="18"></lucide-icon>
    <input
      type="search"
      [placeholder]="'filters.searchPlaceholder' | translate"
      [attr.aria-label]="'filters.searchLabel' | translate"
      autocomplete="off"
      [value]="filters.search"
      (input)="onSearch($any($event.target).value)" />
    @if (filters.search) {
      <button type="button" class="filters__clear" (click)="clearSearch()" [attr.aria-label]="'filters.clearSearch' | translate">
        <lucide-icon [img]="CloseIcon" [size]="14"></lucide-icon>
      </button>
    }
  </label>

  <div class="filters__chips" role="tablist" [attr.aria-label]="'filters.procedures' | translate">
    @for (o of categoryOptions; track o.value) {
      <button
        type="button"
        role="tab"
        class="filters__chip"
        [class.is-active]="filters.category === o.value"
        [attr.aria-selected]="filters.category === o.value"
        (click)="setCategory(o.value)">
        {{ o.label | translate }}
      </button>
    }
  </div>

  <button type="button" class="filters__more" [class.has-active]="activeCount > 0" (click)="openSheet()">
    <lucide-icon [img]="FilterIcon" [size]="18"></lucide-icon>
    @if (activeCount > 0) {
      <span>{{ 'filters.filtersCount' | translate: { count: activeCount } }}</span>
    } @else {
      <span class="filters__label-desktop">{{ 'filters.priceFor' | translate }}</span>
      <span class="filters__label-mobile">{{ 'filters.filters' | translate }}</span>
    }
  </button>
</div>

<!-- Filters sheet: centered on desktop, bottom sheet on mobile -->
<div class="sheet-scrim" [class.is-open]="sheetOpen" (click)="closeSheet()"></div>
<div class="sheet" [class.is-open]="sheetOpen" role="dialog" aria-modal="true" aria-labelledby="filters-title" [attr.aria-hidden]="!sheetOpen">
  <div class="sheet__panel">
    <span class="sheet__handle" aria-hidden="true"></span>

    <div class="sheet__head">
      <h3 id="filters-title" class="sheet__title">{{ 'filters.filters' | translate }}</h3>
      <button type="button" class="sheet__reset" (click)="resetFilters()">{{ 'filters.reset' | translate }}</button>
    </div>

    <p class="sheet__label">{{ 'filters.price' | translate }}</p>
    <div class="sheet__chips">
      @for (o of priceOptions; track o.value) {
        <button type="button" class="chip" [class.is-active]="filters.price === o.value" (click)="setPrice(o.value)">
          {{ o.label | translate }}
        </button>
      }
    </div>

    <p class="sheet__label">{{ 'filters.for' | translate }}</p>
    <div class="segmented">
      @for (o of audienceOptions; track o.value) {
        <button type="button" class="segmented__item" [class.is-active]="filters.audience === o.value" (click)="setAudience(o.value)">
          {{ o.label | translate }}
        </button>
      }
    </div>

    <button type="button" class="btn btn-primary btn--lg sheet__submit" (click)="closeSheet()">
      {{ 'filters.show' | translate: { count: resultCount, label: ((resultCount === 1 ? 'common.salon' : 'common.salons') | translate) } }}
    </button>
  </div>
</div>
